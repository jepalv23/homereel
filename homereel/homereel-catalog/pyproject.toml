[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homereel"
version = "0.1.0"
description = "A tiny CLI catalog for your home movie collection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
homereel = "homereel.cli:main"

[tool.setuptools]
packages = ["homereel"]
